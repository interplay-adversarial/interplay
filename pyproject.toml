[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "interplay-adversarial"
dynamic = ["version"]
description = "Adversarial and red-teaming library: probe generation and attack methodologies for AI systems"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Interplay Adversarial contributors" }]
keywords = ["red-teaming", "adversarial", "llm", "agents", "ai-safety", "jailbreak", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.12"
dependencies = [
    "data-designer>=0.9.4",
    "pydantic>=2.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.scripts]
interplay = "interplay.cli:main"

[project.optional-dependencies]
assessment = [
    "data-designer>=0.9.5",
    "any-llm-sdk>=1.33",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6",
    "pip-audit>=2.7",
    "any-llm-sdk>=1.33",
    "httpx>=0.27",
    "judge-kappa>=0.4.0",
    "Pillow>=10.0",
]
red-teaming = [
    "any-llm-sdk>=1.33",
    "httpx>=0.27",
    "judge-kappa>=0.4.0",
]
# The Garak scanner is a separate, heavy install; only the Garak runner needs it.
# 0.17.1 is the first release whose datasets requirement (>=5.0.1,<6.0) admits the
# patched datasets (PYSEC-2026-3716); 0.17.0's datasets<4.0 forced vulnerable 3.x,
# which in turn capped fsspec below the patched 2026.6.0 (PYSEC-2026-4217).
garak = [
    "garak>=0.17.1",
]
# Only the multimodal runner's image rendering needs Pillow; it is imported
# lazily there, so a text-only red-teaming consumer never needs this extra.
multimodal = [
    "Pillow>=10.0",
]
# More LLM providers for any-llm-sdk (20+ SDKs); pick individual ones instead if you prefer,
# for example any-llm-sdk[gemini].
providers = [
    "any-llm-sdk[all]>=1.33",
]
all = [
    "interplay-adversarial[red-teaming,multimodal,providers]",
]

[project.urls]
Homepage = "https://github.com/interplay-adversarial/interplay"
Documentation = "https://github.com/interplay-adversarial/interplay/tree/main/docs"
Repository = "https://github.com/interplay-adversarial/interplay"
Security = "https://github.com/interplay-adversarial/interplay/security/policy"
Issues = "https://github.com/interplay-adversarial/interplay/issues"

[tool.hatch.version]
path = "interplay/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["interplay"]

[tool.ruff]
line-length = 100
# .github/scripts/git-hygiene.py is a verbatim copy of an external tool; keep it identical to its source.
extend-exclude = [".github/scripts"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["interplay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v"

[tool.uv]
# garak pins old cohere/mistralai versions that any-llm-sdk[all] (the providers extra) cannot
# share, so the two extras cannot be installed together. `all` therefore leaves garak out.
conflicts = [
    [{ extra = "garak" }, { extra = "providers" }],
    [{ extra = "garak" }, { extra = "all" }],
    [{ extra = "garak" }, { extra = "assessment" }],
]

[dependency-groups]
# What `uv sync` installs by default: lint, tests and the dependency audit, plus the
# red-teaming packages the tests import. The `dev` extra above is the same list for pip users.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6",
    "pip-audit>=2.7",
    "any-llm-sdk>=1.33",
    "httpx>=0.27",
    "judge-kappa>=0.4.0",
    "Pillow>=10.0",
]
