[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "interplay-adversarial"
version = "0.1.0"
description = "Adversarial and red-teaming library: probe generation and attack methodologies for AI systems"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.13,<3.14"
dependencies = [
    "data-designer>=0.1.0",
    "pydantic>=2.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6",
]
red-teaming = [
    "any-llm-sdk[all]>=0.1.0",
    "garak>=0.10.0",
    "httpx>=0.27.0",
    "judge-kappa>=0.1.0",
]

[project.scripts]
validate-pipeline-precommit = "scripts.validate-pipeline-precommit:main"

[project.urls]
Repository = "https://github.com/interplay-adversarial/interplay"
Issues = "https://github.com/interplay-adversarial/interplay/issues"

[tool.hatch.build.targets.wheel]
packages = ["interplay"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["interplay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.6",
]
