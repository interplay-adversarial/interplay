name: Tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"        # weekly: new CVEs are published without any commit

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (garak is not needed for the mocked unit tests)
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest tests -q

  audit:
    # pip-audit (PyPA, open source) checks the installed dependency set against the
    # PyPI/OSV advisory database. Runs on PRs, pushes and weekly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the project and the test dependencies
        run: pip install -e ".[dev]"
      - name: Audit dependencies for known vulnerabilities
        # Ignored: CVE-2026-104851 (fsspec ReferenceFileSystem template injection, fixed in
        # fsspec 2026.6.0). data-designer-engine pins fsspec<2026, so the fix cannot be installed
        # yet. Interplay does not use ReferenceFileSystem. Remove the ignore once data-designer
        # lifts the pin.
        run: pip-audit --skip-editable --progress-spinner off --ignore-vuln CVE-2026-104851
