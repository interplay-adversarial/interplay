name: Tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"        # weekly: new CVEs are published without any commit

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff lint
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  tests:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (garak is not needed for the mocked unit tests)
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: pytest tests -q
      - name: Runner CLI execution and hard-interruption recovery (loopback fixtures only)
        run: python scripts/runner_cli_conformance.py --output "$RUNNER_TEMP/runner-conformance"
      - name: Runner refinement, conversation and image conformance (loopback fixtures only)
        run: python scripts/runner_cli_conformance.py --profile extended --output "$RUNNER_TEMP/runner-extended-conformance"

  gym-target:
    name: Native Gym target (${{ matrix.revision }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: f444b8020a3431fc820ef061cef400140bc7afb5
            python: '3.13.14'
            requirements: onboarding/gym/requirements.txt
          - revision: b454c9a6e9a5644564fac81064050094b237daaa
            python: '3.14.7'
            requirements: onboarding/gym/requirements-b454.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the explicit optional native baseline
        env:
          GYM_REQUIREMENTS: ${{ matrix.requirements }}
        run: |
          python -m pip install -r "$GYM_REQUIREMENTS"
          python -m pip install --no-deps .
      - name: Native complete, exhaustion, truncation and source rejection
        env:
          GYM_TEST_REVISION: ${{ matrix.revision }}
          NEMO_TELEMETRY_ENABLED: 'false'
        run: |
          python -c 'import nemo_gym'
          python -m unittest discover -s tests -p test_gym_target_native.py -v

  audit:
    # pip-audit (PyPA, open source) checks the installed dependency set against the
    # PyPI/OSV advisory database. Runs on PRs, pushes and weekly.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the project and the test dependencies
        run: pip install -e ".[dev]"
      - name: Audit dependencies for known vulnerabilities
        # DataDesigner 0.9.5 requires patched fsspec>=2026.6.0; no advisory suppression.
        run: pip-audit --skip-editable --progress-spinner off
