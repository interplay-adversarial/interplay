name: Publish

on:
  release:
    types: [published]       # GitHub release -> PyPI
  workflow_dispatch:          # manual run -> TestPyPI

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa  # v10.3.1
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  testpypi-gate:
    # A release may only reach PyPI if this exact version was already published to TestPyPI and verified
    # (see docs/RELEASING.md). Runs before the approval prompt of the pypi environment.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Require the same version on TestPyPI
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${TAG#v}"
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://test.pypi.org/pypi/interplay-adversarial/${version}/json")
          if [ "$code" != 200 ]; then
            echo "::error::interplay-adversarial ${version} is not on TestPyPI. Run the Publish workflow manually first, verify it with scripts/smoke_install.py --index testpypi --version ${version}, then release (docs/RELEASING.md)."
            exit 1
          fi

  pypi:
    if: github.event_name == 'release'
    needs: [build, testpypi-gate]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
