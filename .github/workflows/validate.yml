name: Validate

on:
  pull_request:
    paths:
      - "pipeline.py"
      - "interplay/specs/**"

jobs:
  validate-specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pydantic numpy pandas

      - name: Validate all specs load correctly
        run: python tests/test_specs.py

  validate-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install data-designer
        run: pip install "data-designer>=0.9.4" pydantic numpy pandas python-dotenv

      - name: Validate pipeline schema
        run: data-designer validate pipeline.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
