name: Hygiene

# Server-side twin of the local git hooks: every commit of a pull request is signed off by the
# human, and no Claude or Hermes session link/id appears in a commit, the diff, or the PR text.
# Bot-authored commits skip the human sign-off only when GitHub says the PR author is a bot
# (Dependabot, CodeRabbit); the session checks always apply. The engine is a copy of
# scripts/git-hygiene/git-hygiene.py in the maintainer's workspace.
# Why: a session link in a public commit ties the repo to a private conversation.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    env:
      GIT_HYGIENE_STRICT: "1"            # a git failure or checker error fails the check
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Load the checker from the base branch
        # A pull request must not be able to weaken the check that judges it. Only the PR that
        # first adds the checker has no base copy and falls back to its own.
        run: |
          git show "$BASE_SHA:.github/scripts/git-hygiene.py" > "$RUNNER_TEMP/git-hygiene.py" 2>/dev/null \
            || cp .github/scripts/git-hygiene.py "$RUNNER_TEMP/git-hygiene.py"
      - name: Commits and diff
        run: python3 "$RUNNER_TEMP/git-hygiene.py" range "$BASE_SHA" "$HEAD_SHA"
        env:
          GIT_HYGIENE_ALLOW_BOT_COMMITS: ${{ github.event.pull_request.user.type == 'Bot' && '1' || '0' }}
      - name: Pull request title and body
        run: |
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" > "$RUNNER_TEMP/pr.txt"
          flag=--require-signoff
          [ "$PR_AUTHOR_TYPE" = Bot ] && flag=""
          python3 "$RUNNER_TEMP/git-hygiene.py" text $flag "$RUNNER_TEMP/pr.txt"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
